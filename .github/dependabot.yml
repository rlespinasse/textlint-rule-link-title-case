---
version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 5
    commit-message:
      prefix: 'build'
      include: 'scope'
    open-pull-requests-limit: 10
    groups:
      dependencies:
        dependency-type: production
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
      dev-dependencies:
        dependency-type: development
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 5
    commit-message:
      prefix: 'build'
      include: 'scope'
    groups:
      dependencies:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
