name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        node-version:
          # https://nodejs.org/en/about/previous-releases#release-schedule
          # Maintenance LTS until may 2026
          - 20
          # Maintenance LTS until may 2027
          - 22
          # Active LTS
          - 24
          # Current
          - 25

    runs-on: ${{ matrix.os }}
    name: Using Node.js ${{ matrix.node-version }} on ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}

      - uses: taiki-e/install-action@2ca9b94c269419b7b0c711c09d0b21c4e1d51145 # v2.83.1
        with:
          tool: just

      - name: Setup Project
        run: just setup

      - name: Validate all
        run: just validate-all
