name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        node-version:
          # https://nodejs.org/en/about/previous-releases#release-schedule
          # Maintenance LTS until may 2026
          - 20
          # Maintenance LTS until may 2027
          - 22
          # Active LTS
          - 24
          # Current
          - 25

    runs-on: ${{ matrix.os }}
    name: Using Node.js ${{ matrix.node-version }} on ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2.83.4
        with:
          tool: just

      - name: Setup Project
        run: just setup

      - name: Validate all
        run: just validate-all
